name: ai-continuity-lab

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: continuity
      POSTGRES_USER: continuity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports: the database is reachable only on the internal Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuity -d continuity"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: ai-continuity-lab:1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://continuity:${POSTGRES_PASSWORD:-local-only-demo}@db:5432/continuity
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      LAB_MODEL_ADAPTER: ${LAB_MODEL_ADAPTER:-fixture}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL_LIGHT: ${OLLAMA_MODEL_LIGHT:-}
      OLLAMA_MODEL_HEAVY: ${OLLAMA_MODEL_HEAVY:-}
      LOG_RAW_PROMPTS: "false"
    ports:
      # Bound to localhost only.
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  # Optional local inference. Not started by default: `docker compose --profile ollama up --build`.
  ollama:
    image: ollama/ollama:0.40.13
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
